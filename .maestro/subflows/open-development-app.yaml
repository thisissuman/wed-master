appId: com.suman.mangalya.development
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Mangalya Dev|New development server"
    timeout: 30000
- openLink: "exp+mangalya://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- runFlow:
    when:
      visible: "New development server"
    commands:
      - tapOn: "http://.*:8081"
- extendedWaitUntil:
    visible: "Continue|Mangalya introduction|Next"
    timeout: 120000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Close"
          timeout: 10000
      - tapOn: "Close"
- assertVisible: "Mangalya introduction|Next"
