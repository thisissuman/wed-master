appId: com.suman.mangalya.development
---
- runFlow:
    file: subflows/open-development-app.yaml
- runFlow:
    file: subflows/create-workspace.yaml
- tapOn: "More"
- tapOn: "Open Backup & Export"
- assertVisible: "Backup & export"
- tapOn: "Export data backup"
- extendedWaitUntil:
    visible: "Sharing .* file|Share with"
    timeout: 10000
- pressKey: Back
- assertVisible: "Backup history"
