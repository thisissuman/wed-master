</div>
</div>

</div>

<!-- Script to handle file upload visual feedback (basic) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const uploadArea = document.querySelector('.border-dashed');
            const fileInput = uploadArea.querySelector('input[type="file"]');

            uploadArea.addEventListener('click', () => fileInput.click());

            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('bg-surface-container');
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('bg-surface-container');
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('bg-surface-container');
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    updateUploadText(e.dataTransfer.files[0].name);
                }
            });

            fileInput.addEventListener('change', () => {
                if (fileInput.files.length) {
                    updateUploadText(fileInput.files[0].name);
                }
            });

            function updateUploadText(filename) {
                const textSpan = uploadArea.querySelector('.font-body-md');
                textSpan.textContent = filename;
                textSpan.classList.add('text-secondary');
            }
        });
    </script>
